name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.25"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgles2-mesa-dev libvulkan-dev mesa-vulkan-drivers libxkbcommon-x11-dev libx11-xcb-dev libxcursor-dev libxfixes-dev

      - name: Build
        run: go build ./...

      - name: Test
        run: make test

      - name: Vet
        run: make vet

  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgles2-mesa-dev libvulkan-dev mesa-vulkan-drivers libxkbcommon-x11-dev libx11-xcb-dev libxcursor-dev libxfixes-dev

      - name: Generate Material 3 screenshots
        run: make visual

      - name: Upload Material 3 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: material3-screenshots
          path: out/material3-screenshots
          if-no-files-found: warn
          retention-days: 14
