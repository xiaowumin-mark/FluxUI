name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.25"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgles2-mesa-dev

      - name: Build examples
        run: |
          mkdir -p dist
          for dir in examples/*/; do
            name=$(basename "$dir")
            if [ -f "${dir}main.go" ]; then
              echo "Building $name..."
              ext=""
              [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
              go build -o "dist/${name}${ext}" "./${dir}"
            fi
          done
        shell: bash

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
