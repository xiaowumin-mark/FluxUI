name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.25.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgles2-mesa-dev libvulkan-dev mesa-vulkan-drivers libxkbcommon-x11-dev libx11-xcb-dev libxcursor-dev libxfixes-dev

      - name: Build examples
        run: |
          mkdir -p dist
          for dir in examples/*/; do
            name=$(basename "$dir")
            if [ -f "${dir}main.go" ]; then
              echo "Building $name..."
              ext=""
              [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
              go build -o "dist/${name}${ext}" "./${dir}"
            fi
          done
        shell: bash

      - name: Upload artifacts
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          token: ${{ github.token }}
          files: dist/*
